name: CI/CD Pipeline & Komodo Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/${{ github.repository }}/frontend

jobs:
  # -------------------------------------------------------------------------
  # 1. TEST & VALIDATE
  # -------------------------------------------------------------------------
  test-and-validate:
    name: Test Backend & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend testing
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend QA & PDF Single-Page Tests
        run: |
          cd backend
          python test_api_and_pdf.py

      # Frontend testing & build
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------------------
  # 2. BUILD & PUSH DOCKER IMAGES (GHCR)
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images to GHCR
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase image names for Docker registry compliance
      - name: Prepare Image Tags
        id: meta
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=${{ env.REGISTRY }}/${LOWER_REPO}/backend" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.REGISTRY }}/${LOWER_REPO}/frontend" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Build and push Backend image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:latest
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:latest
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 3. DEPLOY TO KOMODO
  # -------------------------------------------------------------------------
  deploy-komodo:
    name: Trigger Komodo Stack Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy via Komodo Webhook or API
        shell: bash
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
          KOMODO_HOST: ${{ secrets.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_STACK_NAME: ${{ secrets.KOMODO_STACK_NAME || 'miso-omnisearch' }}
        run: |
          echo "Initiating deployment to Komodo orchestrator..."

          if [ -n "$KOMODO_WEBHOOK_URL" ]; then
            echo "Triggering Komodo Stack redeployment via Webhook..."
            AUTH_HEADER=""
            if [ -n "$KOMODO_WEBHOOK_SECRET" ]; then
              AUTH_HEADER="-H \"X-Komodo-Secret: $KOMODO_WEBHOOK_SECRET\""
            fi
            
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$KOMODO_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              ${AUTH_HEADER} \
              -d "{\"event\":\"push\",\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}")
            
            HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            echo "Komodo webhook response code: $HTTP_CODE"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Successfully triggered Komodo deployment webhook!"
            else
              echo "⚠️ Komodo webhook responded with status $HTTP_CODE: $RESPONSE"
              exit 1
            fi

          elif [ -n "$KOMODO_HOST" ] && [ -n "$KOMODO_API_KEY" ]; then
            echo "Triggering Komodo Stack redeployment via Komodo API..."
            CLEAN_HOST="${KOMODO_HOST%/}"
            
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$CLEAN_HOST/api/v1/deploy-stack" \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: $KOMODO_API_KEY" \
              -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -d "{\"stack\":\"$KOMODO_STACK_NAME\"}")

            HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            echo "Komodo API response code: $HTTP_CODE"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Successfully requested Komodo stack deployment via API!"
            else
              echo "⚠️ Komodo API responded with status $HTTP_CODE: $RESPONSE"
              exit 1
            fi

          else
            echo "ℹ️ No Komodo deployment secrets configured yet."
            echo "To enable automated deployments, configure repository secrets:"
            echo "  - KOMODO_WEBHOOK_URL (e.g. https://komodo.yourdomain.com/listener/github/stack/miso-omnisearch)"
            echo "  - (Optional) KOMODO_WEBHOOK_SECRET"
            echo "Or API authentication:"
            echo "  - KOMODO_HOST, KOMODO_API_KEY, KOMODO_API_SECRET, KOMODO_STACK_NAME"
          fi
