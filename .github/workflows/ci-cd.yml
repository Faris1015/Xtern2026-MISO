name: CI/CD Pipeline & Komodo Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # -------------------------------------------------------------------------
  # 1. TEST & VALIDATE
  # -------------------------------------------------------------------------
  test-and-validate:
    name: Test Backend & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend testing
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend QA & PDF Single-Page Tests
        run: |
          cd backend
          python test_api_and_pdf.py

      # Frontend testing & build
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------------------
  # 2. BUILD & PUSH DOCKER IMAGES (GHCR)
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images to GHCR
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase image names for Docker registry compliance
      - name: Prepare Image Tags
        id: meta
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=${{ env.REGISTRY }}/${LOWER_REPO}/backend" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.REGISTRY }}/${LOWER_REPO}/frontend" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Build and push Backend image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:latest
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:latest
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 3. DEPLOY TO KOMODO
  # -------------------------------------------------------------------------
  deploy-komodo:
    name: Trigger Komodo Stack Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy via Komodo Webhook or API
        shell: bash
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
          KOMODO_HOST: ${{ secrets.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_STACK_NAME: ${{ secrets.KOMODO_STACK_NAME || 'miso-omnisearch' }}
        run: |
          echo "Initiating deployment to Komodo orchestrator..."

          # Sanitize inputs by trimming whitespace, carriage returns, and quotes
          CLEAN_WEBHOOK_URL=$(echo "$KOMODO_WEBHOOK_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          CLEAN_WEBHOOK_SECRET=$(echo "$KOMODO_WEBHOOK_SECRET" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          CLEAN_HOST=$(echo "$KOMODO_HOST" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e 's/\/$//')
          CLEAN_API_KEY=$(echo "$KOMODO_API_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          CLEAN_API_SECRET=$(echo "$KOMODO_API_SECRET" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          CLEAN_STACK_NAME=$(echo "$KOMODO_STACK_NAME" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')

          if [ -n "$CLEAN_WEBHOOK_URL" ] && [[ "$CLEAN_WEBHOOK_URL" =~ ^https?:// ]]; then
            echo "Triggering Komodo Stack redeployment via Webhook..."
            CURL_ARGS=(
              -s -S
              -w "\nHTTP_STATUS:%{http_code}"
              -X POST "$CLEAN_WEBHOOK_URL"
              -H "Content-Type: application/json"
            )
            if [ -n "$CLEAN_WEBHOOK_SECRET" ]; then
              CURL_ARGS+=(-H "X-Komodo-Secret: $CLEAN_WEBHOOK_SECRET")
            fi
            CURL_ARGS+=(-d "{\"event\":\"push\",\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}")

            set +e
            RESPONSE=$(curl "${CURL_ARGS[@]}" 2>&1)
            CURL_EXIT=$?
            set -e

            if [ $CURL_EXIT -ne 0 ]; then
              echo "::warning::Komodo webhook request failed (curl exit code $CURL_EXIT): $RESPONSE"
              echo "Continuing workflow since Docker build and image publication succeeded."
              exit 0
            fi

            HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
            echo "Komodo webhook response code: $HTTP_CODE"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Successfully triggered Komodo deployment webhook!"
            else
              echo "::warning::Komodo webhook responded with non-2xx status $HTTP_CODE: $BODY"
            fi

          elif [ -n "$CLEAN_HOST" ] && [ -n "$CLEAN_API_KEY" ] && [[ "$CLEAN_HOST" =~ ^https?:// ]]; then
            echo "Triggering Komodo Stack redeployment via Komodo API..."
            CURL_ARGS=(
              -s -S
              -w "\nHTTP_STATUS:%{http_code}"
              -X POST "$CLEAN_HOST/api/v1/deploy-stack"
              -H "Content-Type: application/json"
              -H "X-Api-Key: $CLEAN_API_KEY"
              -d "{\"stack\":\"$CLEAN_STACK_NAME\"}"
            )
            if [ -n "$CLEAN_API_SECRET" ]; then
              CURL_ARGS+=(-H "X-Api-Secret: $CLEAN_API_SECRET")
            fi

            set +e
            RESPONSE=$(curl "${CURL_ARGS[@]}" 2>&1)
            CURL_EXIT=$?
            set -e

            if [ $CURL_EXIT -ne 0 ]; then
              echo "::warning::Komodo API request failed (curl exit code $CURL_EXIT): $RESPONSE"
              echo "Continuing workflow since Docker build and image publication succeeded."
              exit 0
            fi

            HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
            echo "Komodo API response code: $HTTP_CODE"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Successfully requested Komodo stack deployment via API!"
            else
              echo "::warning::Komodo API responded with non-2xx status $HTTP_CODE: $BODY"
            fi

          else
            echo "ℹ️ No valid Komodo deployment URL or API configured."
            echo "To enable automated deployments, configure repository secrets with a valid URL starting with http:// or https://"
          fi
