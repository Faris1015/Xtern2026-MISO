services:
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-faris1015/xtern2026-miso}/backend:${IMAGE_TAG:-latest}
    container_name: miso-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - miso-net

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-faris1015/xtern2026-miso}/frontend:${IMAGE_TAG:-latest}
    container_name: miso-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - miso-net

networks:
  miso-net:
    driver: bridge
